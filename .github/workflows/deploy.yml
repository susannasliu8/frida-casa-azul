name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Serialize all deployments — they all push to the gh-pages branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---- Production (push to main) ----
      - name: Build (production)
        if: github.event_name == 'push'
        run: npm run build
        env:
          BASE_PATH: /frida-casa-azul/

      - name: Deploy production
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true # don't wipe existing pr-preview/ folders

      # ---- Per-PR preview ----
      - name: Build (preview)
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: npm run build
        env:
          BASE_PATH: /frida-casa-azul/pr-preview/pr-${{ github.event.number }}/

      - name: Deploy / update / remove PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@2fb559e4766555e23d07b73d313fe97c4f8c3cfe # v1.6.1
        with:
          source-dir: ./dist
