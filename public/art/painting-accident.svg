      <path d="M300 350 L 300 460" stroke="#f6efe1" stroke-width="6" opacity="0.6"/>
  
    <rect x="0" y="0" width="600" height="800" fill="url(#grain)"/>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette)"/>
