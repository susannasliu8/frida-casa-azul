    <circle cx="378" cy="370" r="26" fill="#d98a86" opacity="0.45"/>
    <!-- the unibrow -->
    <path d="M205 300 Q 255 282 300 296 Q 345 282 395 300
             Q 345 308 300 308 Q 255 308 205 300 Z" fill="#241a17"/>
    <!-- eyes -->
    <ellipse cx="248" cy="330" rx="26" ry="17" fill="#fff"/>
    <ellipse cx="352" cy="330" rx="26" ry="17" fill="#fff"/>
    <circle cx="250" cy="332" r="9" fill="#241a17"/>
    <circle cx="354" cy="332" r="9" fill="#241a17"/>
    <!-- nose -->
    <path d="M300 330 Q 316 380 300 392 Q 284 392 288 384"
