    <!-- lips -->
    <path d="M258 420 Q 300 408 342 420 Q 300 452 258 420 Z" fill="#a82a4f"/>
    <path d="M258 420 Q 300 426 342 420" stroke="#6f1832" stroke-width="2.5" fill="none"/>
    <!-- flower crown -->
    <g transform="translate(150 230) rotate(-35)">
    <path d="M0 0 C 18 -28 18 -58 0 -82 C -18 -58 -18 -28 0 0 Z" fill="#5a7d4f"/>
    <path d="M0 0 L0 -78" stroke="#38502f" stroke-width="2.5"/>
  </g>
    <g transform="translate(450 230) rotate(35)">
