<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <defs>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <pattern id="grain" width="600" height="800" patternUnits="userSpaceOnUse">
      <rect width="600" height="800" filter="url(#g)" opacity="0.08"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0f08" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
    
    <rect x="0" y="0" width="600" height="800" fill="#5a7d4f"/>
    <rect x="0" y="0" width="600" height="800" fill="url(#topLight)"/>
    <!-- shoulders / rebozo -->
    <path d="M70 800 C 150 570, 450 570, 530 800 Z"
          fill="#38502f"/>
    <path d="M150 800 C 210 650, 390 650, 450 800 Z"
          fill="#c1357a"/>
    <!-- neck -->
    <rect x="262" y="430" width="76" height="120" rx="22" fill="#d99f74"/>
